    content: |
      Review the following Music Player project.

      Please provide:
      1. Code quality issues (HTML, CSS, JS)
      2. UI/UX improvement suggestions
      3. Accessibility improvements
      4. Performance optimizations
      5. Refactoring recommendations

      Context:
      - Vanilla JavaScript
      - Responsive design
      - Portfolio project
